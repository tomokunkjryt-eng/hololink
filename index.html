<html lang="ja">  
<head>  
<meta charset="UTF-8">

<title>ホロライブJP メンバー</title>  
  
<style>  
*{box-sizing:border-box}  
  
body{  
  margin:0;  
  background:#f5f7fb;  
  color:#222;  
  font-family:Arial,"Noto Sans JP",sans-serif;  
}  
  
header{  
  background:#fff;  
  padding:18px;  
  text-align:center;  
  box-shadow:0 2px 10px #ddd;  
  position:sticky;  
  top:0;  
  z-index:10;  
}  
  
h1{  
  margin:0 0 14px;  
  font-size:25px;  
}  
  
.controls{  
  display:flex;  
  gap:8px;  
  justify-content:center;  
  flex-wrap:wrap;  
}  
  
input,select{  
  padding:10px 12px;  
  border:1px solid #ccc;  
  border-radius:10px;  
  font-size:14px;  
  background:#fff;  
}  
  
#status{  
  margin-top:9px;  
  font-size:12px;  
  color:#666;  
}  
  
#members{  
  max-width:1200px;  
  margin:20px auto;  
  padding:0 12px 30px;  
  display:grid;  
  grid-template-columns:repeat(auto-fill,minmax(190px,1fr));  
  gap:15px;  
}  
  
.card{  
  background:#fff;  
  border-radius:16px;  
  padding:12px;  
  text-align:center;  
  box-shadow:0 3px 12px #ddd;  
  transition:.2s;  
  cursor:pointer;  
}  
  
.card:hover{  
  transform:translateY(-3px);  
}  
  
.main-avatar{  
  width:120px;  
  height:120px;  
  border-radius:50%;  
  object-fit:cover;  
  border:4px solid transparent;  
  transition:.2s;  
}  
  
.main-avatar.live{  
  border-color:#f22;  
}  
  
.main-avatar.upcoming{  
  border-color:#1683ff;  
}  
  
.name{  
  font-weight:bold;  
  font-size:17px;  
  margin:9px 0 3px;  
}  
  
.group{  
  font-size:12px;  
  color:#777;  
  white-space:pre-wrap;  
}  
  
.date{  
  font-size:11px;  
  color:#999;  
  margin-top:5px;  
}  
  
.profile-row{  
  display:flex;  
  align-items:center;  
  justify-content:center;  
  gap:8px;  
  margin-top:8px;  
}  
  
.stream-info{  
  display:flex;  
  flex-direction:column;  
  align-items:flex-start;  
  gap:5px;  
  min-height:30px;  
}  
  
.stream-item{  
  display:flex;  
  align-items:center;  
  gap:5px;  
  font-size:10px;  
  white-space:nowrap;  
}  
  
.stream-dot{  
  width:9px;  
  height:9px;  
  min-width:9px;  
  border-radius:50%;  
}  
  
.stream-dot.live{  
  background:#f22;  
}  
  
.stream-dot.upcoming{  
  background:#1683ff;  
}  
  
.stream-none{  
  font-size:10px;  
  color:#aaa;  
}  
  
.socials{  
  display:flex;  
  justify-content:center;  
  gap:8px;  
  margin-top:10px;  
}  
  
.social{  
  width:44px;  
  height:44px;  
  border-radius:50%;  
  overflow:hidden;  
  background:#eee;  
  display:flex;  
  align-items:center;  
  justify-content:center;  
}  
  
.social img{  
  width:100%;  
  height:100%;  
  object-fit:cover;  
}  
  
.hidden{  
  display:none!important;  
}  
  
/* ===== モーダル ===== */  
  
.modal{  
  display:none;  
  position:fixed;  
  inset:0;  
  background:rgba(0,0,0,.65);  
  z-index:100;  
  overflow-y:auto;  
  padding:25px 12px;  
}  
  
.modal.show{  
  display:block;  
}  
  
.modal-box{  
  max-width:650px;  
  margin:0 auto;  
  background:#fff;  
  border-radius:20px;  
  padding:20px;  
  position:relative;  
}  
  
.close{  
  position:absolute;  
  top:10px;  
  right:14px;  
  width:35px;  
  height:35px;  
  border:0;  
  border-radius:50%;  
  background:#eee;  
  font-size:22px;  
  cursor:pointer;  
}  
  
.modal-head{  
  text-align:center;  
  margin-bottom:15px;  
}  
  
.modal-avatar{  
  width:110px;  
  height:110px;  
  border-radius:50%;  
  object-fit:cover;  
  border:4px solid transparent;  
}  
  
.modal-avatar.live{  
  border-color:#f22;  
}  
  
.modal-avatar.upcoming{  
  border-color:#1683ff;  
}  
  
.modal-name{  
  font-size:22px;  
  font-weight:bold;  
  margin-top:8px;  
}  
  
.modal-group{  
  color:#777;  
  font-size:12px;  
  margin-top:4px;  
}  
  
.section-title{  
  font-weight:bold;  
  font-size:15px;  
  margin:18px 0 8px;  
}  
  
.video-list{  
  display:flex;  
  flex-direction:column;  
  gap:9px;  
}  
  
.video-item{  
  display:flex;  
  gap:10px;  
  padding:9px;  
  background:#f2f4f7;  
  border-radius:10px;  
  text-decoration:none;  
  color:#222;  
}  
  
.video-item:hover{  
  background:#e5e8ec;  
}  
  
.video-thumb{  
  width:130px;  
  height:73px;  
  object-fit:cover;  
  border-radius:7px;  
  background:#ddd;  
  flex-shrink:0;  
}  
  
.video-title{  
  font-size:12px;  
  font-weight:bold;  
  line-height:1.4;  
}  
  
.video-date{  
  font-size:10px;  
  color:#888;  
  margin-top:5px;  
}  
  
.empty{  
  color:#999;  
  font-size:12px;  
  padding:10px;  
  background:#f5f5f5;  
  border-radius:8px;  
}  
  
.modal-links{  
  display:flex;  
  justify-content:center;  
  gap:10px;  
  margin-top:18px;  
}  
  
.modal-links a{  
  padding:9px 15px;  
  border-radius:10px;  
  text-decoration:none;  
  color:#fff;  
  font-size:12px;  
  font-weight:bold;  
}  
  
.youtube-link{  
  background:#f00;  
}  
  
.x-link{  
  background:#111;  
}  
  
@media(max-width:600px){  
  
  #members{  
    grid-template-columns:repeat(2,1fr);  
    gap:10px;  
    padding:0 8px 30px;  
  }  
  
  .card{  
    padding:12px 6px;  
    border-radius:14px;  
  }  
  
  .main-avatar{  
    width:85px;  
    height:85px;  
  }  
  
  .name{  
    font-size:14px;  
    line-height:1.3;  
  }  
  
  .group{  
    font-size:10px;  
  }  
  
  .profile-row{  
    display:block;  
  }  
  
  .stream-info{  
    align-items:center;  
    margin-top:5px;  
    gap:3px;  
  }  
  
  .stream-item{  
    font-size:9px;  
    gap:4px;  
  }  
  
  .stream-dot{  
    width:8px;  
    height:8px;  
    min-width:8px;  
  }  
  
  .stream-none{  
    display:none;  
  }  
  
  .socials{  
    gap:5px;  
    margin-top:8px;  
  }  
  
  .social{  
    width:40px;  
    height:40px;  
  }  
  
  .date{  
    font-size:8px;  
    margin-top:6px;  
  }  
  
  .modal{  
    padding:10px 7px;  
  }  
  
  .modal-box{  
    padding:16px 10px;  
  }  
  
  .modal-avatar{  
    width:90px;  
    height:90px;  
  }  
  
  .modal-name{  
    font-size:19px;  
  }  
  
  .video-thumb{  
    width:105px;  
    height:59px;  
  }  
  
  .video-title{  
    font-size:11px;  
  }  
}  
</style>  
</head>

/* ==================================================  
   画像  
   ================================================== */  
  
function fallbackAvatar(name){  
  
  const svg=  
  "<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>"+  
  "<rect width='100%' height='100%' fill='#e9edf2'/>"+  
  "<text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' "+  
  "font-size='42' fill='#888'>"+  
  name.substring(0,1)+  
  "</text></svg>";  
  
  return "data:image/svg+xml;charset=UTF-8,"+  
  encodeURIComponent(svg);  
}  
  
  
function ytAvatar(handle,apiAvatar){  
  
  if(apiAvatar)return apiAvatar;  
  
  return "https://unavatar.io/youtube/@"+  
  encodeURIComponent(handle);  
}  
  
  
function xAvatar(handle){  
  
  return "https://unavatar.io/x/"+  
  encodeURIComponent(handle);  
}  
  
  
/* ==================================================  
   日付  
   ================================================== */  
  
function debutText(date){  
  
  const d=new Date(date+"T00:00:00");  
  
  return "デビュー："+  
    d.getFullYear()+"年"+  
    (d.getMonth()+1)+"月"+  
    d.getDate()+"日";  
}  
  
  
/* ==================================================  
   相対時間  
   ================================================== */  
  
function relativeTime(time){  
  
  if(!time)return "";  
  
  const diff=Date.now()-new Date(time).getTime();  
  
  if(diff<0){  
  
    const min=Math.ceil(-diff/60000);  
  
    if(min<60)return "あと"+min+"分";  
  
    const hour=Math.floor(min/60);  
  
    if(hour<24)return "あと"+hour+"時間";  
  
    return "あと"+Math.floor(hour/24)+"日";  
  }  
  
  const min=Math.floor(diff/60000);  
  
  if(min<1)return "たった今";  
  
  if(min<60)return min+"分前";  
  
  const hour=Math.floor(min/60);  
  
  if(hour<24)return hour+"時間前";  
  
  return Math.floor(hour/24)+"日前";  
}  
  
  
/* ==================================================  
   カード  
   ================================================== */  
  
function createCard(m){  
  
  const card=document.createElement("article");  
  
  card.className="card";  
  
  card.dataset.name=m.name;  
  
  card.dataset.groups=m.groups.join(",");  
  
  card.addEventListener("click",()=>openModal(m));  
  
  
  const img=document.createElement("img");  
  
  img.className="main-avatar";  
  
  img.alt=m.name;  
  
  img.src=fallbackAvatar(m.name);  
  
  img.onerror=()=>{  
    img.onerror=null;  
    img.src=fallbackAvatar(m.name);  
  };  
  
  
  const name=document.createElement("div");  
  
  name.className="name";  
  
  name.textContent=m.name;  
  
  
  const group=document.createElement("div");  
  
  group.className="group";  
  
  group.textContent=m.group;  
  
  
  const date=document.createElement("div");  
  
  date.className="date";  
  
  date.textContent=debutText(m.date);  
  
  
  const profile=document.createElement("div");  
  
  profile.className="profile-row";  
  
  
  const info=document.createElement("div");  
  
  info.className="stream-info";  
  
  info.id="stream-"+m.name;  
  
  
  const none=document.createElement("div");  
  
  none.className="stream-none";  
  
  none.textContent="配信情報を確認中…";  
  
  info.appendChild(none);  
  
  
  profile.appendChild(info);  
  
  
  const socials=document.createElement("div");  
  
  socials.className="socials";  
  
  
  const yt=document.createElement("a");  
  
  yt.className="social";  
  
  yt.href=m.youtubeURL;  
  
  yt.target="_blank";  
  
  yt.rel="noopener";  
  
  yt.addEventListener("click",e=>e.stopPropagation());  
  
  
  const ytimg=document.createElement("img");  
  
  ytimg.alt="YouTube";  
  
  ytimg.src=fallbackAvatar(m.name);  
  
  ytimg.onerror=()=>{  
    ytimg.onerror=null;  
    ytimg.src=fallbackAvatar(m.name);  
  };  
  
  yt.appendChild(ytimg);  
  
  
  const x=document.createElement("a");  
  
  x.className="social";  
  
  x.href=m.xURL;  
  
  x.target="_blank";  
  
  x.rel="noopener";  
  
  x.addEventListener("click",e=>e.stopPropagation());  
  
  
  const ximg=document.createElement("img");  
  
  ximg.alt="X";  
  
  ximg.src=xAvatar(m.x);  
  
  ximg.onerror=()=>{  
    ximg.onerror=null;  
    ximg.src=fallbackAvatar("X");  
  };  
  
  x.appendChild(ximg);  
  
  
  socials.appendChild(yt);  
  
  socials.appendChild(x);  
  
  
  card.appendChild(img);  
  
  card.appendChild(name);  
  
  card.appendChild(group);  
  
  card.appendChild(date);  
  
  card.appendChild(profile);  
  
  card.appendChild(socials);  
  
  
  m._card={  
    card,  
    img,  
    ytimg,  
    info  
  };  
  
  
  return card;  
}  
  
  
members.forEach(m=>{  
  document.getElementById("members").appendChild(createCard(m));  
});  
  
  
/* ==================================================  
   カード更新  
   ================================================== */  
  
function updateCard(m){  
  
  const info=m.info;  
  
  const img=m._card.img;  
  
  const stream=m._card.info;  
  
  
  img.classList.remove("live","upcoming");  
  
  
  if(info.avatar){  
  
    img.src=info.avatar;  
  
  }else{  
  
    img.src=ytAvatar(m.youtube,null);  
  
  }  
  
  
  m._card.ytimg.src=  
    ytAvatar(m.youtube,info.avatar);  
  
  
  stream.innerHTML="";  
  
  
  if(info.isLive){  
  
    img.classList.add("live");  
  
  
    const live=document.createElement("div");  
  
    live.className="stream-item";  
  
    live.innerHTML=  
      "<span class='stream-dot live'></span>"+  
      "LIVE・"+relativeTime(info.liveStartTime);  
  
    stream.appendChild(live);  
  
  }  
  
  
  if(info.isUpcoming){  
  
    if(!info.isLive){  
  
      img.classList.add("upcoming");  
  
    }  
  
  
    const upcoming=document.createElement("div");  
  
    upcoming.className="stream-item";  
  
    upcoming.innerHTML=  
      "<span class='stream-dot upcoming'></span>"+  
      "待機・"+relativeTime(info.upcomingStartTime);  
  
    stream.appendChild(upcoming);  
  
  }  
  
  
  if(!info.isLive && !info.isUpcoming){  
  
    const none=document.createElement("div");  
  
    none.className="stream-none";  
  
    none.textContent="配信情報なし";  
  
    stream.appendChild(none);  
  
  }  
  
}  
  
  
/* ==================================================  
   Workerから取得  
   ================================================== */  
  
async function refreshFromWorker(){  
  
  const status=document.getElementById("status");  
  
  status.textContent=  
    "YouTube情報を取得中…";  
  
  
  try{  
  
    const handles=members  
      .map(m=>m.youtube)  
      .join(",");  
  
  
    const url=  
      WORKER_URL+  
      "?handles="+  
      encodeURIComponent(handles);  
  
  
    const response=  
      await fetch(url,{  
        method:"GET",  
        cache:"no-store"  
      });  
  
  
    if(!response.ok){  
  
      throw new Error(  
        "Worker HTTP "+response.status  
      );  
  
    }  
  
  
    const data=  
      await response.json();  
  
  
    if(!data.ok){  
  
      throw new Error(  
        data.error||  
        "Workerから正常なデータが返ってきませんでした"  
      );  
  
    }  
  
  
    for(const m of members){  
  
      const info=  
        data.members?.[m.youtube];  
  
  
      if(!info)continue;  
  
  
      m.info={  
        avatar:info.avatar||null,  
  
        isLive:!!info.isLive,  
  
        isUpcoming:!!info.isUpcoming,  
  
        liveURL:info.liveURL||null,  
  
        upcomingURL:info.upcomingURL||null,  
  
        liveStartTime:  
          info.liveStartTime||null,  
  
        upcomingStartTime:  
          info.upcomingStartTime||null,  
  
        liveTitle:  
          info.liveTitle||null,  
  
        upcomingTitle:  
          info.upcomingTitle||null,  
  
        latest:  
          Array.isArray(info.latest)  
            ?info.latest.slice(0,2)  
            :[]  
      };  
  
  
      updateCard(m);  
  
    }  
  
  
    status.textContent=  
      "YouTube情報を取得しました"+  
      (data.cached?"（キャッシュ）":"");  
  
  
  }catch(error){  
  
    console.error(error);  
  
    status.textContent=  
      "YouTube情報を取得できませんでした";  
  
  }  
  
}  
  
  
/* ==================================================  
   検索・フィルター  
   ================================================== */  
  
function filter(){  
  
  const q=  
    document  
      .getElementById("search")  
      .value  
      .toLowerCase();  
  
  
  const gen=  
    document  
      .getElementById("genFilter")  
      .value;  
  
  
  document  
    .querySelectorAll(".card")  
    .forEach(card=>{  
  
      const name=  
        card.dataset.name  
          .toLowerCase()  
          .includes(q);  
  
  
      const groups=  
        card.dataset.groups  
          .split(",");  
  
  
      const generation=  
        gen==="all"||  
        groups.includes(gen);  
  
  
      card.classList.toggle(  
        "hidden",  
        !(name&&generation)  
      );  
  
    });  
  
}  
  
  
document  
  .getElementById("search")  
  .addEventListener("input",filter);  
  
  
document  
  .getElementById("genFilter")  
  .addEventListener("change",filter);  
  
  
/* ==================================================  
   モーダル  
   ================================================== */  
  
function videoItem(video){  
  
  const a=document.createElement("a");  
  
  a.className="video-item";  
  
  a.href=video.url||  
    "https://www.youtube.com/watch?v="+video.videoId;  
  
  a.target="_blank";  
  
  a.rel="noopener";  
  
  
  const img=document.createElement("img");  
  
  img.className="video-thumb";  
  
  img.src=  
    video.thumb||  
    fallbackAvatar("▶");  
  
  img.onerror=()=>{  
    img.onerror=null;  
    img.src=fallbackAvatar("▶");  
  };  
  
  
  const text=document.createElement("div");  
  
  
  const title=document.createElement("div");  
  
  title.className="video-title";  
  
  title.textContent=  
    video.title||  
    "動画";  
  
  
  text.appendChild(title);  
  
  
  if(video.publishedAt){  
  
    const date=document.createElement("div");  
  
    date.className="video-date";  
  
    const d=  
      new Date(video.publishedAt);  
  
    date.textContent=  
      d.getFullYear()+"年"+  
      (d.getMonth()+1)+"月"+  
      d.getDate()+"日";  
  
    text.appendChild(date);  
  
  }  
  
  
  a.appendChild(img);  
  
  a.appendChild(text);  
  
  
  return a;  
}  
  
  
function openModal(m){  
  
  const modal=  
    document.getElementById("modal");  
  
  
  const info=m.info;  
  
  
  document  
    .getElementById("modalName")  
    .textContent=m.name;  
  
  
  document  
    .getElementById("modalGroup")  
    .textContent=  
      m.group+  
      "　"+  
      debutText(m.date);  
  
  
  const avatar=  
    document.getElementById("modalAvatar");  
  
  
  avatar.className="modal-avatar";  
  
  
  if(info.isLive){  
  
    avatar.classList.add("live");  
  
  }else if(info.isUpcoming){  
  
    avatar.classList.add("upcoming");  
  
  }  
  
  
  avatar.src=  
    info.avatar||  
    ytAvatar(m.youtube,null);  
  
  
  avatar.onerror=()=>{  
    avatar.onerror=null;  
    avatar.src=fallbackAvatar(m.name);  
  };  
  
  
  /* ===== ライブ ===== */  
  
  const liveSection=  
    document.getElementById(  
      "modalLiveSection"  
    );  
  
  const liveBox=  
    document.getElementById(  
      "modalLive"  
    );  
  
  
  liveBox.innerHTML="";  
  
  
  if(info.isLive&&info.liveURL){  
  
    liveSection.style.display="block";  
  
  
    const v=videoItem({  
  
      videoId:  
        info.liveURL  
          .split("v=")[1]||  
        "",  
  
      url:info.liveURL,  
  
      title:  
        info.liveTitle||  
        "現在ライブ中",  
  
      thumb:  
        info.liveThumb||  
        info.avatar  
  
    });  
  
  
    liveBox.appendChild(v);  
  
  }else{  
  
    liveSection.style.display="none";  
  
  }  
  
  
  /* ===== 待機 ===== */  
  
  const upcomingSection=  
    document.getElementById(  
      "modalUpcomingSection"  
    );  
  
  const upcomingBox=  
    document.getElementById(  
      "modalUpcoming"  
    );  
  
  
  upcomingBox.innerHTML="";  
  
  
  if(  
    info.isUpcoming&&  
    info.upcomingURL  
  ){  
  
    upcomingSection.style.display="block";  
  
  
    upcomingBox.appendChild(  
      videoItem({  
  
        videoId:  
          info.upcomingURL  
            .split("v=")[1]||  
          "",  
  
        url:info.upcomingURL,  
  
        title:  
          info.upcomingTitle||  
          "待機中の配信",  
  
        thumb:  
          info.upcomingThumb||  
          info.avatar  
  
      })  
    );  
  
  }else{  
  
    upcomingSection.style.display="none";  
  
  }  
  
  
  /* ===== 最新動画2本 ===== */  
  
  const latestBox=  
    document.getElementById(  
      "modalLatest"  
    );  
  
  
  latestBox.innerHTML="";  
  
  
  const latest=  
    Array.isArray(info.latest)  
      ?info.latest.slice(0,2)  
      :[];  
  
  
  if(latest.length){  
  
    latest.forEach(video=>{  
  
      latestBox.appendChild(  
        videoItem(video)  
      );  
  
    });  
  
  }else{  
  
    const empty=  
      document.createElement("div");  
  
    empty.className="empty";  
  
    empty.textContent=  
      "最新動画を取得できませんでした";  
  
    latestBox.appendChild(empty);  
  
  }  
  
  
  /* ===== プロフィール ===== */  
  
  const links=  
    document.getElementById(  
      "modalLinks"  
    );  
  
  
  links.innerHTML="";  
  
  
  const yt=  
    document.createElement("a");  
  
  yt.className="youtube-link";  
  
  yt.href=m.youtubeURL;  
  
  yt.target="_blank";  
  
  yt.rel="noopener";  
  
  yt.textContent="YouTube";  
  
  
  const x=  
    document.createElement("a");  
  
  x.className="x-link";  
  
  x.href=m.xURL;  
  
  x.target="_blank";  
  
  x.rel="noopener";  
  
  x.textContent="X";  
  
  
  links.appendChild(yt);  
  
  links.appendChild(x);  
  
  
  modal.classList.add("show");  
  
}  
  
  
document  
  .getElementById("closeModal")  
  .addEventListener(  
    "click",  
    ()=>{  
      document  
        .getElementById("modal")  
        .classList.remove("show");  
    }  
  );  
  
  
document  
  .getElementById("modal")  
  .addEventListener(  
    "click",  
    e=>{  
      if(e.target.id==="modal"){  
  
        e.currentTarget  
          .classList  
          .remove("show");  
  
      }  
    }  
  );  
  
  
/* ==================================================  
   時間表示を30秒ごと更新  
   ライブ終了後はWorkerの最新状態を取得する  
   ================================================== */  
  
setInterval(()=>{  
  
  members.forEach(m=>{  
  
    if(!m.info)return;  
  
    updateCard(m);  
  
  });  
  
},30000);  
  
  
/* ==================================================  
   15分ごとにWorkerへ確認  
   ================================================== */  
  
setInterval(  
  refreshFromWorker,  
  15*60*1000  
);  
  
  
/* 初回 */  
  
refreshFromWorker();  
  
</script>
