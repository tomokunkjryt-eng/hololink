<title>ホロライブJP メンバー</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#222;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
}


/* =========================
   ヘッダー
========================= */

header{
  background:#fff;
  padding:18px 12px;
  text-align:center;
  box-shadow:0 2px 10px #ddd;
  position:sticky;
  top:0;
  z-index:10;
}

h1{
  margin:0 0 14px;
  font-size:25px;
}

.controls{
  display:flex;
  gap:8px;
  justify-content:center;
  flex-wrap:wrap;
}

input,
select{
  padding:10px 12px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:14px;
  background:#fff;
}

#status{
  margin-top:9px;
  font-size:12px;
  color:#666;
}


/* =========================
   メンバー
========================= */

#members{
  max-width:1200px;
  margin:20px auto;
  padding:0 12px;

  display:grid;

  grid-template-columns:
    repeat(auto-fill,minmax(190px,1fr));

  gap:15px;
}


/* =========================
   カード
========================= */

.card{
  background:#fff;
  border-radius:16px;
  padding:12px;
  text-align:center;
  box-shadow:0 3px 12px #ddd;
  transition:.2s;
}

.card:hover{
  transform:translateY(-3px);
}

.mainLink{
  display:block;
  position:relative;
  text-decoration:none;
  cursor:pointer;
}

.mainImg{
  width:120px;
  height:120px;
  border-radius:50%;
  object-fit:cover;

  border:4px solid transparent;

  transition:.2s;
}

.mainImg.live{
  border-color:#f22;
}

.mainImg.upcoming{
  border-color:#1683ff;
}

.statusBadge{
  display:none;

  position:absolute;

  left:50%;
  bottom:0;

  transform:translateX(-50%);

  padding:4px 9px;

  border-radius:999px;

  color:#fff;

  font-size:11px;

  font-weight:bold;

  white-space:nowrap;
}

.statusBadge.live{
  display:block;
  background:#f22;
}

.statusBadge.upcoming{
  display:block;
  background:#1683ff;
}

.name{
  font-weight:bold;
  font-size:17px;
  margin:9px 0 3px;
}

.gen{
  font-size:12px;
  color:#777;
}

.debut{
  font-size:11px;
  color:#999;
  margin-top:3px;
}


/* =========================
   SNSボタン
========================= */

.buttons{
  display:flex;
  justify-content:center;
  gap:9px;
  margin-top:12px;
}

.buttons a{
  display:block;
  width:44px;
  height:44px;
  border-radius:50%;
  overflow:hidden;
  background:#eee;
}

.buttons img{
  width:100%;
  height:100%;
  object-fit:cover;
}


/* =========================
   配信状態
========================= */

.cardStatus{
  margin-top:9px;
  font-size:12px;
  min-height:18px;
}

.liveText{
  color:#f22;
  font-weight:bold;
}

.upcomingText{
  color:#1683ff;
  font-weight:bold;
}

.dot{
  display:inline-block;
  width:8px;
  height:8px;
  border-radius:50%;
  margin-right:5px;
}

.redDot{
  background:#f22;
}

.blueDot{
  background:#1683ff;
}


/* =========================
   非表示
========================= */

.hidden{
  display:none!important;
}


/* =========================
   モーダル
========================= */

#modal{
  display:none;

  position:fixed;

  inset:0;

  z-index:100;

  background:rgba(0,0,0,.55);

  padding:18px;

  overflow-y:auto;
}

#modal.show{
  display:flex;

  align-items:flex-start;

  justify-content:center;
}

.modalBox{
  width:100%;
  max-width:600px;

  background:#fff;

  border-radius:20px;

  margin:20px auto;

  padding:20px;

  position:relative;

  box-shadow:0 10px 40px rgba(0,0,0,.3);
}

.close{
  position:absolute;

  top:10px;
  right:12px;

  width:38px;
  height:38px;

  border:0;

  border-radius:50%;

  background:#eee;

  font-size:22px;

  cursor:pointer;
}


/* =========================
   モーダルプロフィール
========================= */

.modalProfile{
  text-align:center;

  padding-top:5px;

  margin-bottom:18px;
}

.modalAvatar{
  width:110px;
  height:110px;

  border-radius:50%;

  object-fit:cover;

  border:4px solid transparent;
}

.modalAvatar.live{
  border-color:#f22;
}

.modalAvatar.upcoming{
  border-color:#1683ff;
}

.modalName{
  font-size:22px;
  font-weight:bold;

  margin-top:8px;
}

.modalGroup{
  font-size:13px;
  color:#777;

  margin-top:3px;
}


/* =========================
   セクション
========================= */

.sectionTitle{
  font-size:16px;

  font-weight:bold;

  margin:
    20px 0
    9px;

  padding-bottom:6px;

  border-bottom:1px solid #ddd;
}


/* =========================
   配信カード
========================= */

.streamCard{
  display:block;

  text-decoration:none;

  color:#222;

  border-radius:12px;

  overflow:hidden;

  background:#f4f5f7;

  margin-bottom:10px;

  border:2px solid transparent;
}

.streamCard.live{
  border-color:#f22;
}

.streamCard.upcoming{
  border-color:#1683ff;
}

.streamThumb{
  display:block;

  width:100%;

  aspect-ratio:16/9;

  object-fit:cover;
}

.streamTitle{
  padding:10px;

  font-size:13px;

  font-weight:bold;
}


/* =========================
   直近の動画
========================= */

.latestList{
  display:flex;

  flex-direction:column;

  gap:10px;
}

.latestVideo{
  display:flex;

  gap:10px;

  padding:8px;

  background:#f4f5f7;

  border-radius:12px;

  text-decoration:none;

  color:#222;

  transition:.15s;
}

.latestVideo:hover{
  background:#e7e9ec;
}

.latestThumb{
  width:150px;

  aspect-ratio:16/9;

  object-fit:cover;

  border-radius:8px;

  flex-shrink:0;
}

.latestInfo{
  min-width:0;

  display:flex;

  flex-direction:column;

  justify-content:center;
}

.latestTitle{
  font-size:13px;

  font-weight:bold;

  line-height:1.45;

  word-break:break-word;
}

.latestDate{
  font-size:11px;

  color:#888;

  margin-top:5px;
}

.noLatest{
  background:#f4f5f7;

  border-radius:10px;

  padding:12px;

  color:#777;

  font-size:12px;

  text-align:center;
}


/* =========================
   モーダルSNS
========================= */

.modalSNS{
  display:flex;

  gap:10px;

  margin-top:20px;
}

.modalSNS a{
  flex:1;

  padding:11px;

  border-radius:10px;

  background:#eee;

  text-decoration:none;

  color:#222;

  text-align:center;

  font-weight:bold;

  font-size:13px;
}


/* =========================
   モバイル
========================= */

@media(max-width:600px){

  #members{
    grid-template-columns:repeat(2,1fr);

    gap:10px;

    padding:0 8px;
  }

  .card{
    padding:9px;
  }

  .mainImg{
    width:100px;
    height:100px;
  }

  .name{
    font-size:15px;
  }

  .buttons a{
    width:40px;
    height:40px;
  }

  .latestThumb{
    width:125px;
  }

  .modalBox{
    margin:8px auto;
    padding:15px;
  }

}


/* =========================
   極小画面
========================= */

@media(max-width:360px){

  .latestThumb{
    width:105px;
  }

  .latestTitle{
    font-size:12px;
  }

}

</style>

/* =========================
   HTMLエスケープ
========================= */

function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================
   日付
========================= */

function formatDate(date){

  if(!date){
    return "";
  }

  const d =
    new Date(date);

  if(
    Number.isNaN(d.getTime())
  ){
    return "";
  }

  return (
    d.getFullYear() +
    "/" +
    String(d.getMonth()+1).padStart(2,"0") +
    "/" +
    String(d.getDate()).padStart(2,"0")
  );

}


/* =========================
   相対時間
========================= */

function relativeTime(date){

  if(!date){
    return "";
  }

  const target =
    new Date(date).getTime();

  const diff =
    target - Date.now();

  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;


  if(diff <= 0){

    const elapsed =
      Math.abs(diff);

    if(elapsed < minute){
      return "開始したばかり";
    }

    if(elapsed < hour){

      return (
        Math.floor(
          elapsed / minute
        ) +
        "分前に開始"
      );

    }

    if(elapsed < day){

      return (
        Math.floor(
          elapsed / hour
        ) +
        "時間前に開始"
      );

    }

    return (
      Math.floor(
        elapsed / day
      ) +
      "日前に開始"
    );
  }


  if(diff < hour){

    return (
      Math.max(
        1,
        Math.floor(diff / minute)
      ) +
      "分後に開始"
    );

  }


  if(diff < day){

    return (
      Math.floor(diff / hour) +
      "時間後に開始"
    );

  }


  return (
    Math.floor(diff / day) +
    "日後に開始"
  );

}


/* =========================
   カード作成
========================= */

function makeCard(member,index){

  const name =
    member[0];

  const gen =
    member[1];

  const debut =
    member[2];

  const youtube =
    member[3];

  const x =
    member[4];


  const card =
    document.createElement("article");

  card.className =
    "card";

  card.dataset.name =
    name;

  card.dataset.gen =
    gen;

  card.dataset.index =
    index;


  /* メイン */

  const main =
    document.createElement("a");

  main.className =
    "mainLink";

  main.href =
    "javascript:void(0)";

  main.addEventListener(
    "click",
    function(event){

      event.preventDefault();

      openModal(index);

    }
  );


  const img =
    document.createElement("img");

  img.className =
    "mainImg";

  img.src =
    "images/" +
    images[name];

  img.alt =
    name;


  img.onerror =
    function(){

      this.src =
        "https://unavatar.io/youtube/" +
        encodeURIComponent(
          youtube
        );

    };


  const badge =
    document.createElement("span");

  badge.className =
    "statusBadge";


  main.appendChild(img);

  main.appendChild(badge);


  /* 名前 */

  const nameBox =
    document.createElement("div");

  nameBox.className =
    "name";

  nameBox.textContent =
    name;


  /* 世代 */

  const genBox =
    document.createElement("div");

  genBox.className =
    "gen";

  genBox.textContent =
    gen;


  /* デビュー */

  const debutBox =
    document.createElement("div");

  debutBox.className =
    "debut";

  debutBox.textContent =
    "デビュー：" +
    debut;


  /* SNS */

  const buttons =
    document.createElement("div");

  buttons.className =
    "buttons";


  /* YouTube */

  const yt =
    document.createElement("a");

  yt.href =
    "https://www.youtube.com/@" +
    youtube;

  yt.target =
    "_blank";

  yt.rel =
    "noopener";


  const ytImg =
    document.createElement("img");

  ytImg.src =
    "images/" +
    images[name];

  ytImg.alt =
    "YouTube";


  yt.appendChild(
    ytImg
  );


  /* X */

  const xb =
    document.createElement("a");

  xb.href =
    "https://x.com/" +
    x;

  xb.target =
    "_blank";

  xb.rel =
    "noopener";


  const xi =
    document.createElement("img");

  xi.src =
    "https://unavatar.io/x/" +
    x;

  xi.alt =
    "X";


  xi.onerror =
    function(){

      this.src =
        "images/" +
        images[name];

    };


  xb.appendChild(
    xi
  );


  buttons.appendChild(
    yt
  );

  buttons.appendChild(
    xb
  );


  /* 状態 */

  const state =
    document.createElement("div");

  state.className =
    "cardStatus";

  state.id =
    "cardStatus" + index;


  card.appendChild(
    main
  );

  card.appendChild(
    nameBox
  );

  card.appendChild(
    genBox
  );

  card.appendChild(
    debutBox
  );

  card.appendChild(
    buttons
  );

  card.appendChild(
    state
  );


  document
    .getElementById("members")
    .appendChild(card);

}


members.forEach(
  makeCard
);


/* =========================
   フィルター
========================= */

document
  .getElementById("search")
  .addEventListener(
    "input",
    filter
  );

document
  .getElementById("genFilter")
  .addEventListener(
    "change",
    filter
  );


function filter(){

  const q =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();


  const gen =
    document
      .getElementById("genFilter")
      .value;


  document
    .querySelectorAll(".card")
    .forEach(card => {

      const index =
        Number(
          card.dataset.index
        );

      const member =
        members[index];


      const nameOK =
        member[0]
          .toLowerCase()
          .includes(q);


      let genOK = false;


      if(gen === "all"){

        genOK = true;

      }
      else if(
        member[5] &&
        Array.isArray(member[5])
      ){

        genOK =
          member[5].includes(gen);

      }
      else{

        genOK =
          member[1] === gen;

      }


      card.classList.toggle(
        "hidden",
        !(nameOK && genOK)
      );

    });

}


/* =========================
   Worker取得
========================= */

async function getMemberFromWorker(
  member,
  index
){

  const handle =
    member[3];


  try{

    const url =
      WORKER_URL +
      "?handle=" +
      encodeURIComponent(
        handle
      );


    const response =
      await fetch(
        url,
        {
          cache:"no-store"
        }
      );


    const data =
      await response.json();


    if(
      !response.ok ||
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Worker error"
      );

    }


    /*
      latestが存在しない場合でも
      必ず空配列にする
    */

    if(
      !Array.isArray(
        data.latest
      )
    ){

      data.latest = [];

    }


    memberData[index] =
      data;


    updateCard(
      index,
      data
    );


    return data;

  }
  catch(error){

    console.error(
      member[0],
      error
    );


    memberData[index] = {

      ok:false,

      channel:{
        avatar:
          "images/" +
          images[member[0]]
      },

      live:null,

      upcoming:null,

      /*
        ここも必ず存在させる
      */

      latest:[],

      error:
        error.message

    };


    updateCard(
      index,
      memberData[index]
    );


    return memberData[index];

  }

}


/* =========================
   カード状態更新
========================= */

function updateCard(
  index,
  data
){

  const card =
    document.querySelector(
      '.card[data-index="' +
      index +
      '"]'
    );


  if(!card){
    return;
  }


  const img =
    card.querySelector(
      ".mainImg"
    );


  const badge =
    card.querySelector(
      ".statusBadge"
    );


  const status =
    document.getElementById(
      "cardStatus" +
      index
    );


  img.classList.remove(
    "live",
    "upcoming"
  );


  badge.className =
    "statusBadge";

  badge.textContent =
    "";


  status.innerHTML =
    "";


  /*
    LIVE優先
  */

  if(data.live){

    img.classList.add(
      "live"
    );

    badge.classList.add(
      "live"
    );

    badge.textContent =
      "LIVE配信中";


    const started =
      data.live.startedAt ||
      data.live.actualStartTime ||
      "";


    status.innerHTML =
      '<span class="dot redDot"></span>' +
      '<span class="liveText">' +
      (
        relativeTime(started) ||
        "LIVE配信中"
      ) +
      '</span>';


    return;
  }


  /*
    待機枠
  */

  if(data.upcoming){

    img.classList.add(
      "upcoming"
    );

    badge.classList.add(
      "upcoming"
    );

    badge.textContent =
      "ライブ待機中";


    status.innerHTML =
      '<span class="dot blueDot"></span>' +
      '<span class="upcomingText">' +
      (
        relativeTime(
          data.upcoming.scheduledStartTime
        ) ||
        "ライブ待機中"
      ) +
      '</span>';

    return;
  }


  status.textContent =
    "配信予定なし";

}


/* =========================
   モーダル
========================= */

function openModal(index){

  const member =
    members[index];


  const data =
    memberData[index] || {

      channel:{
        avatar:
          "images/" +
          images[member[0]]
      },

      live:null,

      upcoming:null,

      latest:[]

    };


  /*
    latestは必ず配列
  */

  const latest =
    Array.isArray(
      data.latest
    )
      ? data.latest
      : [];


  const channel =
    data.channel || {};


  let avatar =
    channel.avatar ||
    "images/" +
    images[member[0]];


  let avatarClass =
    "";


  if(data.live){

    avatarClass =
      "live";

  }
  else if(data.upcoming){

    avatarClass =
      "upcoming";

  }


  let html = "";


  /* =========================
     プロフィール
  ========================= */

  html += `

    <div class="modalProfile">

      <img
        class="modalAvatar ${avatarClass}"
        src="${escapeHTML(avatar)}"
        alt="${escapeHTML(member[0])}"
      >

      <div class="modalName">
        ${escapeHTML(member[0])}
      </div>

      <div class="modalGroup">
        ${escapeHTML(member[1])}
      </div>

    </div>

  `;


  /* =========================
     LIVE
  ========================= */

  if(data.live){

    html += `

      <div class="sectionTitle">
        🔴 LIVE配信中
      </div>

      <a
        class="streamCard live"
        href="${escapeHTML(data.live.url)}"
        target="_blank"
        rel="noopener"
      >

        <img
          class="streamThumb"
          src="${escapeHTML(data.live.thumb)}"
          alt=""
        >

        <div class="streamTitle">
          ${escapeHTML(data.live.title)}
        </div>

      </a>

    `;

  }


  /* =========================
     次の配信
  ========================= */

  if(data.upcoming){

    html += `

      <div class="sectionTitle">
        🔵 次の配信
      </div>

      <a
        class="streamCard upcoming"
        href="${escapeHTML(data.upcoming.url)}"
        target="_blank"
        rel="noopener"
      >

        <img
          class="streamThumb"
          src="${escapeHTML(data.upcoming.thumb)}"
          alt=""
        >

        <div class="streamTitle">
          ${escapeHTML(data.upcoming.title)}
        </div>

      </a>

    `;

  }


  /* =========================
     ここが重要
     直近の動画
  ========================= */

  html += `

    <div class="sectionTitle">
      ▶ 直近の動画
    </div>

  `;


  if(latest.length > 0){

    html +=
      '<div class="latestList">';


    latest
      .slice(0,2)
      .forEach(video => {

        if(
          !video ||
          !video.url
        ){

          return;

        }


        html += `

          <a
            class="latestVideo"
            href="${escapeHTML(video.url)}"
            target="_blank"
            rel="noopener"
          >

            <img
              class="latestThumb"
              src="${escapeHTML(video.thumb || "")}"
              alt=""
            >

            <div class="latestInfo">

              <div class="latestTitle">
                ${escapeHTML(
                  video.title ||
                  "動画"
                )}
              </div>

              <div class="latestDate">
                ${escapeHTML(
                  formatDate(
                    video.publishedAt
                  )
                )}
              </div>

            </div>

          </a>

        `;

      });


    html +=
      '</div>';

  }
  else{

    /*
      動画0本でも
      「直近の動画」そのものは消さない
    */

    html += `

      <div class="noLatest">

        直近の動画を取得できませんでした

      </div>

    `;

  }


  /* =========================
     SNS
  ========================= */

  html += `

    <div class="modalSNS">

      <a
        href="https://www.youtube.com/@${encodeURIComponent(member[3])}"
        target="_blank"
        rel="noopener"
      >
        YouTube
      </a>

      <a
        href="https://x.com/${encodeURIComponent(member[4])}"
        target="_blank"
        rel="noopener"
      >
        X
      </a>

    </div>

  `;


  document
    .getElementById(
      "modalContent"
    )
    .innerHTML =
    html;


  document
    .getElementById("modal")
    .classList.add("show");

}


/* =========================
   モーダル閉じる
========================= */

document
  .getElementById("closeModal")
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById("modal")
  .addEventListener(
    "click",
    function(event){

      if(
        event.target === this
      ){

        closeModal();

      }

    }
  );


function closeModal(){

  document
    .getElementById("modal")
    .classList.remove("show");

}


/* =========================
   ESCでも閉じる
========================= */

document
  .addEventListener(
    "keydown",
    function(event){

      if(
        event.key === "Escape"
      ){

        closeModal();

      }

    }
  );


/* =========================
   読み込み開始
========================= */

async function start(){

  const total =
    members.length;


  document
    .getElementById("status")
    .textContent =
    total +
    "人を表示しました。YouTube情報を取得中…";


  /*
    順番に取得。
    Workerは1メンバー1リクエストなので
    Workers Freeの制限を回避。
  */

  for(
    let i = 0;
    i < total;
    i++
  ){

    document
      .getElementById("status")
      .textContent =
      "YouTube情報を取得中… " +
      (i + 1) +
      "/" +
      total;


    await getMemberFromWorker(
      members[i],
      i
    );

  }


  document
    .getElementById("status")
    .textContent =
    total +
    "人の情報を読み込みました";

}


start();
