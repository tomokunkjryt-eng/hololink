content="width=device-width,initial-scale=1">

<title>ホロライブJP メンバー</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f5f7fb;
  color:#222;
  font-family:
    Arial,
    "Noto Sans JP",
    sans-serif;
}


/* =========================
   ヘッダー
========================= */

header{
  background:white;
  padding:18px 12px;
  text-align:center;
  box-shadow:0 2px 10px #ddd;

  position:sticky;
  top:0;

  z-index:100;
}

h1{
  margin:0 0 14px;
  font-size:25px;
}


/* =========================
   検索・フィルター
========================= */

.controls{
  display:flex;
  flex-direction:column;

  gap:8px;

  max-width:600px;

  margin:auto;
}

input,
select{

  width:100%;

  padding:11px 13px;

  border:1px solid #ccc;

  border-radius:10px;

  font-size:14px;

  background:white;

  outline:none;
}

input:focus,
select:focus{
  border-color:#888;
}


#status{

  margin-top:10px;

  font-size:12px;

  color:#666;
}


/* =========================
   メンバー一覧
========================= */

#members{

  max-width:1200px;

  margin:20px auto;

  padding:0 12px 30px;

  display:grid;

  grid-template-columns:
    repeat(
      auto-fill,
      minmax(190px,1fr)
    );

  gap:15px;
}


/* =========================
   カード
========================= */

.card{

  background:white;

  border-radius:16px;

  padding:12px;

  text-align:center;

  box-shadow:
    0 3px 12px #ddd;

  cursor:pointer;

  transition:.2s;
}

.card:hover{

  transform:
    translateY(-3px);

}


/* =========================
   プロフィール
========================= */

.profile-row{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:10px;

  min-height:125px;
}


.main-link{

  width:110px;

  height:110px;

  flex-shrink:0;

  display:block;

  position:relative;

  text-decoration:none;
}


.main-avatar{

  width:110px;

  height:110px;

  border-radius:50%;

  object-fit:cover;

  border:4px solid transparent;

  transition:.2s;

  background:#eee;
}


/* LIVE */

.main-avatar.live{

  border-color:#f22;

  box-shadow:
    0 0 0 3px rgba(
      255,
      34,
      34,
      .12
    );
}


/* 待機中 */

.main-avatar.upcoming{

  border-color:#1683ff;

  box-shadow:
    0 0 0 3px rgba(
      22,
      131,
      255,
      .12
    );
}


/* =========================
   名前
========================= */

.name{

  font-weight:bold;

  font-size:17px;

  margin:
    9px 0 3px;
}


/* =========================
   期生
========================= */

.group{

  font-size:12px;

  color:#777;

  min-height:17px;
}


/* =========================
   デビュー日
========================= */

.date{

  font-size:11px;

  color:#999;

  margin-top:3px;
}


/* =========================
   配信情報
========================= */

.stream-info{

  display:flex;

  flex-direction:column;

  align-items:flex-start;

  gap:4px;

  margin-top:8px;

  min-height:35px;
}


.stream-item{

  display:flex;

  align-items:center;

  gap:6px;

  width:100%;

  text-align:left;

  font-size:11px;

  color:#555;
}


.stream-dot{

  width:9px;

  height:9px;

  min-width:9px;

  border-radius:50%;

  display:inline-block;
}


.stream-dot.live{

  background:#f22;

  box-shadow:
    0 0 6px
    rgba(
      255,
      34,
      34,
      .5
    );
}


.stream-dot.upcoming{

  background:#1683ff;

  box-shadow:
    0 0 6px
    rgba(
      22,
      131,
      255,
      .5
    );
}


.stream-none{

  visibility:hidden;

}


/* =========================
   SNS
========================= */

.socials{

  display:flex;

  justify-content:center;

  gap:9px;

  margin-top:10px;
}


.social{

  width:44px;

  height:44px;

  border-radius:50%;

  overflow:hidden;

  background:#eee;

  display:flex;

  align-items:center;

  justify-content:center;

  text-decoration:none;
}


.social img{

  width:100%;

  height:100%;

  object-fit:cover;
}


/* =========================
   非表示
========================= */

.hidden{

  display:none!important;
}


/* =========================
   モーダル
========================= */

.modal{

  position:fixed;

  inset:0;

  background:
    rgba(
      0,
      0,
      0,
      .65
    );

  display:none;

  align-items:center;

  justify-content:center;

  padding:15px;

  z-index:1000;
}


.modal.show{

  display:flex;
}


.modal-box{

  width:100%;

  max-width:500px;

  max-height:90vh;

  overflow-y:auto;

  background:white;

  border-radius:20px;

  padding:18px;

  position:relative;
}


.close{

  position:absolute;

  top:10px;

  right:12px;

  width:35px;

  height:35px;

  border:0;

  border-radius:50%;

  background:#eee;

  font-size:22px;

  cursor:pointer;
}


.modal-head{

  text-align:center;

  padding:
    5px 35px 15px;
}


.modal-avatar{

  width:100px;

  height:100px;

  border-radius:50%;

  object-fit:cover;

  background:#eee;

  border:4px solid transparent;
}


.modal-avatar.live{

  border-color:#f22;
}


.modal-avatar.upcoming{

  border-color:#1683ff;
}


.modal-name{

  font-size:20px;

  font-weight:bold;

  margin-top:8px;
}


.modal-group{

  color:#777;

  font-size:12px;

  margin-top:3px;
}


/* =========================
   モーダル配信
========================= */

.section-title{

  font-size:15px;

  font-weight:bold;

  margin:
    14px 0 8px;
}


.stream-card{

  display:block;

  text-decoration:none;

  color:#222;

  border-radius:12px;

  padding:9px;

  margin-bottom:8px;

  background:#f2f3f5;
}


.stream-card.live{

  border-left:
    5px solid #f22;
}


.stream-card.upcoming{

  border-left:
    5px solid #1683ff;
}


.stream-thumb{

  width:100%;

  aspect-ratio:16/9;

  object-fit:cover;

  border-radius:9px;

  background:#ddd;
}


.stream-title{

  font-size:13px;

  font-weight:bold;

  margin-top:7px;

  line-height:1.4;
}


/* =========================
   最新動画
========================= */

.video-item{

  display:flex;

  gap:9px;

  text-decoration:none;

  color:#222;

  padding:7px;

  margin-bottom:7px;

  border-radius:10px;

  background:#f2f3f5;
}


.video-thumb{

  width:110px;

  height:62px;

  object-fit:cover;

  border-radius:7px;

  background:#ddd;

  flex-shrink:0;
}


.video-title{

  font-size:12px;

  line-height:1.4;

  font-weight:bold;

  display:
    -webkit-box;

  -webkit-line-clamp:3;

  -webkit-box-orient:vertical;

  overflow:hidden;
}


/* =========================
   モーダルSNS
========================= */

.modal-socials{

  display:flex;

  justify-content:center;

  gap:12px;

  margin-top:15px;
}


.modal-social{

  display:block;

  padding:
    10px 18px;

  border-radius:10px;

  background:#eee;

  color:#222;

  text-decoration:none;

  font-size:13px;

  font-weight:bold;
}


/* =========================
   スマホ
========================= */

@media(max-width:600px){

  #members{

    grid-template-columns:
      repeat(2,1fr);

    gap:10px;

    padding:
      0 8px 30px;
  }


  .card{

    padding:
      12px 6px;

    border-radius:14px;
  }


  .main-link{

    width:85px;

    height:85px;
  }


  .main-avatar{

    width:85px;

    height:85px;
  }


  .name{

    font-size:14px;

    line-height:1.3;
  }


  .group{

    font-size:10px;
  }


  .profile-row{

    display:block;

    min-height:0;
  }


  .stream-info{

    align-items:center;

    margin-top:5px;

    gap:3px;
  }


  .stream-item{

    font-size:9px;

    gap:4px;
  }


  .stream-dot{

    width:8px;

    height:8px;

    min-width:8px;
  }


  .stream-none{

    display:none;
  }


  .socials{

    gap:5px;

    margin-top:8px;
  }


  .social{

    width:38px;

    height:38px;
  }


  .date{

    font-size:8px;

    margin-top:6px;
  }


  .modal-box{

    max-height:92vh;

    padding:14px;
  }


  .video-thumb{

    width:90px;

    height:51px;
  }

}


/* =========================
   読み込み中
========================= */

.loading{

  opacity:.55;
}

/* ==================================================
   時間表示
================================================== */

function timeText(
  timestamp,
  mode
){

  if (!timestamp) {
    return "";
  }


  const diff =
    Date.now() -
    timestamp;


  const abs =
    Math.abs(diff);


  const minutes =
    Math.floor(
      abs / 60000
    );


  if (mode === "live") {

    if (diff < 0) {
      return "開始直前";
    }

    if (minutes < 1) {
      return "1分未満前に開始";
    }

    if (minutes < 60) {
      return (
        minutes +
        "分前に開始"
      );
    }


    const hours =
      Math.floor(
        minutes / 60
      );

    const mins =
      minutes % 60;


    if (mins === 0) {

      return (
        hours +
        "時間前に開始"
      );
    }


    return (
      hours +
      "時間" +
      mins +
      "分前に開始"
    );
  }


  /* upcoming */

  if (diff >= 0) {
    return "まもなく開始";
  }


  const totalMinutes =
    Math.ceil(
      abs / 60000
    );


  if (
    totalMinutes < 60
  ) {

    return (
      totalMinutes +
      "分後に開始"
    );
  }


  const hours =
    Math.floor(
      totalMinutes / 60
    );

  const mins =
    totalMinutes % 60;


  if (mins === 0) {

    return (
      hours +
      "時間後に開始"
    );
  }


  return (
    hours +
    "時間" +
    mins +
    "分後に開始"
  );
}


/* ==================================================
   カード作成
================================================== */

function makeCard(m,index){

  const card =
    document.createElement(
      "article"
    );

  card.className =
    "card loading";

  card.dataset.name =
    m.name;

  card.dataset.groups =
    m.groups.join("|");


  const profileRow =
    document.createElement(
      "div"
    );

  profileRow.className =
    "profile-row";


  const mainLink =
    document.createElement(
      "a"
    );

  mainLink.className =
    "main-link";


  mainLink.addEventListener(
    "click",
    e => {

      e.preventDefault();

      e.stopPropagation();

      openModal(m);

    }
  );


  const avatar =
    document.createElement(
      "img"
    );

  avatar.className =
    "main-avatar";

  avatar.alt =
    m.name;

  avatar.src =
    "https://unavatar.io/youtube/" +
    encodeURIComponent(
      m.youtube
    );


  mainLink.appendChild(
    avatar
  );


  profileRow.appendChild(
    mainLink
  );


  const name =
    document.createElement(
      "div"
    );

  name.className =
    "name";

  name.textContent =
    m.name;


  const group =
    document.createElement(
      "div"
    );

  group.className =
    "group";

  group.textContent =
    m.group;


  const date =
    document.createElement(
      "div"
    );

  date.className =
    "date";

  date.textContent =
    "デビュー：" +
    m.date;


  /* =========================
     配信情報
  ========================= */

  const streamInfo =
    document.createElement(
      "div"
    );

  streamInfo.className =
    "stream-info";


  const liveItem =
    document.createElement(
      "div"
    );

  liveItem.className =
    "stream-item";

  liveItem.id =
    "liveInfo-" +
    index;


  const upcomingItem =
    document.createElement(
      "div"
    );

  upcomingItem.className =
    "stream-item";

  upcomingItem.id =

/* ==================================================
   カードを更新
================================================== */

function updateCard(m){

  const index =
    members.indexOf(m);

  const cards =
    document.querySelectorAll(
      ".card"
    );

  const card =
    cards[index];


  if (!card) {
    return;
  }


  card.classList.remove(
    "loading"
  );


  const avatar =
    card.querySelector(
      ".main-avatar"
    );


  if (
    m.info.avatar
  ) {

    avatar.src =
      m.info.avatar;

  }


  avatar.classList.remove(
    "live",
    "upcoming"
  );


  if (
    m.info.isLive
  ) {

    avatar.classList.add(
      "live"
    );

  } else if (
    m.info.isUpcoming
  ) {

    avatar.classList.add(
      "upcoming"
    );

  }


  const liveInfo =
    document.getElementById(
      "liveInfo-" +
      index
    );


  const upcomingInfo =
    document.getElementById(
      "upcomingInfo-" +
      index
    );


  /* =========================
     LIVE
  ========================= */

  if (
    m.info.isLive &&
    m.info.liveURL
  ) {

    liveInfo.innerHTML =
      '<span class="stream-dot live"></span>' +
      '<span>LIVE・' +
      escapeHTML(
        timeText(
          m.info.liveStartTime,
          "live"
        )
      ) +
      '</span>';

  } else {

    liveInfo.innerHTML =
      '<span class="stream-none">' +
      'LIVE' +
      '</span>';

  }


  /* =========================
     待機
  ========================= */

  if (
    m.info.isUpcoming &&
    m.info.upcomingURL
  ) {

    upcomingInfo.innerHTML =
      '<span class="stream-dot upcoming"></span>' +
      '<span>待機中・' +
      escapeHTML(
        timeText(
          m.info.upcomingStartTime,
          "upcoming"
        )
      ) +
      '</span>';

  } else {

    upcomingInfo.innerHTML =
      '<span class="stream-none">' +
      '待機' +
      '</span>';

  }

}


/* ==================================================
   HTMLエスケープ
================================================== */

function escapeHTML(
  value
){

  return String(
    value ?? ""
  )
  .replace(
    /&/g,
    "&amp;"
  )
  .replace(
    /</g,
    "&lt;"
  )
  .replace(
    />/g,
    "&gt;"
  )
  .replace(
    /"/g,
    "&quot;"
  )
  .replace(
    /'/g,
    "&#039;"
  );

}

/* ==================================================

  document
    .getElementById(
      "modal"
    )
    .classList.remove(
      "show"
    );

}


document
  .getElementById(
    "closeModal"
  )
  .addEventListener(
    "click",
    closeModal
  );


document
  .getElementById(
    "modal"
  )
  .addEventListener(
    "click",
    e => {

      if (
        e.target.id ===
        "modal"
      ) {

        closeModal();

      }

    }
  );


document
  .addEventListener(
    "keydown",
    e => {

      if (
        e.key ===
        "Escape"
      ) {

        closeModal();

      }

    }
  );


/* ==================================================
   検索・フィルター
================================================== */

function filter(){

  const q =
    document
      .getElementById(
        "search"
      )
      .value
      .trim()
      .toLowerCase();


  const gen =
    document
      .getElementById(
        "genFilter"
      )
      .value;


  document
    .querySelectorAll(
      ".card"
    )
    .forEach(
      card => {

        const name =
          card.dataset.name
            .toLowerCase();


        const groups =
          card.dataset.groups
            .split("|");


        const nameOK =
          name.includes(q);


        const groupOK =
          gen === "all" ||
          groups.includes(
            gen
          );


        card.classList.toggle(
          "hidden",
          !(nameOK && groupOK)
        );

      }
    );

}


document
  .getElementById(
    "search"
  )
  .addEventListener(
    "input",
    filter
  );


document
  .getElementById(
    "genFilter"
  )
  .addEventListener(
    "change",
    filter
  );


/* ==================================================
   Workerから1人取得
================================================== */

async function getOneMember(m){

  try{

    const url =
      WORKER_URL +
      "?handle=" +
      encodeURIComponent(
        m.youtube
      );


    const response =
      await fetch(
        url,
        {
          method:"GET",
          cache:"no-store"
        }
      );


    if (
      !response.ok
    ){

      throw new Error(
        "HTTP " +
        response.status
      );

    }


    const data =
      await response.json();


    if (
      !data.ok
    ){

      throw new Error(
        data.error ||
        "Worker error"
      );

    }


    const info =
      data.member;


    m.info = {

      avatar:
        info.avatar ||
        null,

      isLive:
        !!info.isLive,

      isUpcoming:
        !!info.isUpcoming,

      liveURL:
        info.liveURL ||
        null,

      upcomingURL:
        info.upcomingURL ||
        null,

      liveStartTime:
        info.liveStartTime ||
        null,

      upcomingStartTime:
        info.upcomingStartTime ||
        null,

      liveTitle:
        info.liveTitle ||
        null,

      upcomingTitle:
        info.upcomingTitle ||
        null,

      liveThumb:
        info.liveThumb ||
        null,

      upcomingThumb:
        info.upcomingThumb ||
        null,

      latest:
        Array.isArray(
          info.latest
        )
          ?
          info.latest.slice(0,2)
          :
          []

    };


    updateCard(m);


  } catch(e){

    console.error(
      m.name,
      e
    );

    /* API失敗でもカード自体は残す */

    const index =
      members.indexOf(m);


    const card =
      document.querySelectorAll(
        ".card"
      )[index];


    if (card){

      card.classList.remove(
        "loading"
      );

    }

  }

}


/* ==================================================
   全員取得
================================================== */

async function refreshFromWorker(){

  statusBox.textContent =
    "YouTube情報を取得中…";


  let finished = 0;


  /*
   * 1人ずつWorkerへ送る。
   * Worker側では1人分だけYouTube APIを使う。
   */

  for (
    const m of members
  ){

    await getOneMember(
      m
    );


    finished++;


    statusBox.textContent =
      "YouTube情報を取得中… " +
      finished +
      "/" +
      members.length;

  }


  statusBox.textContent =
    "YouTube情報を取得しました";

}


/* ==================================================
   カードを先に表示
================================================== */

members.forEach(
  makeCard
);


/* ==================================================
   開始
================================================== */

refreshFromWorker();


/* ==================================================
   時間表示を1分ごと更新
================================================== */

setInterval(
  () => {

    members.forEach(
      m => {

        if (
          m.info.isLive ||
          m.info.isUpcoming
        ){

          updateCard(m);

        }

      }
    );

  },
  60000
);
